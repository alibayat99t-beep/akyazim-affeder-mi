<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Begüm'üm Affet... 💖</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Mavi ağırlıklı büyüleyici gece arka planı */
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #090d16);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Emojiler ve partiküller (Pembe ışıltılı) */
        .confetti {
            position: fixed;
            user-select: none;
            pointer-events: none;
            animation: explodeUp 3.5s ease-out forwards;
            z-index: 5; 
            filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.9));
        }

        @keyframes explodeUp {
            0% {
                transform: translateY(110vh) scale(0.2) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.9;
            }
            85% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-20vh) scale(1.7) rotate(720deg);
                opacity: 0;
            }
        }

        /* Ana Kart - Telefona tam oturan modern yapı */
        .container {
            max-width: 420px;
            width: 100%;
            background: rgba(18, 24, 38, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            z-index: 10;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .container.celebrate {
            transform: scale(1.03);
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.7);
            border-color: #38bdf8;
        }

        h2 {
            color: #ffb6c1;
            margin-bottom: 10px;
            font-size: 21px;
        }

        /* Begüm ismi her zaman net, kabul edilince devleşiyor ve parlıyor */
        .begum-ismi {
            display: inline-block;
            transition: transform 0.5s ease, font-size 0.5s ease, text-shadow 0.5s ease;
            position: relative;
            z-index: 12;
        }

        .container.celebrate .begum-ismi {
            transform: scale(1.15);
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.9), 0 0 30px rgba(56, 189, 248, 0.8);
        }

        img {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        p {
            color: #e0e0e0;
            font-size: 15px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
            position: relative;
            min-height: 110px;
            align-items: center;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #evetBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.5);
        }

        #hayirBtn {
            background-color: #334155;
            color: #cbd5e1;
            position: relative;
        }

        #sonuc {
            display: none;
            margin-top: 15px;
            background-color: rgba(20, 30, 48, 0.95);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #38bdf8;
            animation: bounceIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { transform: scale(1.08); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <h2><span class="begum-ismi">Begüm</span>'üm, Lütfen Affet... 🌸</h2>
        
        <!-- Fotoğraf (cicek.jpeg aynı klasörde olmalı) -->
        <img src="cicek.jpeg" alt="Özel Fotoğraf" onerror="this.style.display='none'">
        
        <p>
            Sanki seni haksız yere suçluyormuşum gibi hissettirdim, kusura bakma lütfen. 
            Senin tebessümün benim için her şeyden daha değerli... ❤️
        </p>

        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">

        <h4 style="margin: 10px 0; font-size: 17px;">Beni affettin mi? 🥰</h4>

        <div class="buttons" id="buttonArea">
            <button id="evetBtn" onclick="affettiKabulEt()">Evet, affettim! ❤️</button>
            <button id="hayirBtn" 
                    onmouseover="kacir()" 
                    ontouchstart="kacir(); event.preventDefault();" 
                    onclick="kacir()">Hala kırgınım... 😞</button>
        </div>

        <div id="sonuc">
            <h3 style="color: #38bdf8; margin-top: 0; font-size: 20px;">Teşekkür ederim affettiğin için canım! 🎉🥳</h3>
            <p style="margin: 10px 0 0 0; font-size: 15px;">Seni seviyorum, bir daha asla böyle yapmayacağım 💖✨</p>
        </div>
    </div>

    <script>
        function affettiKabulEt() {
            document.getElementById('buttonArea').style.display = 'none';
            document.getElementById('sonuc').style.display = 'block';
            document.getElementById('mainCard').classList.add('celebrate');

            setInterval(createConfetti, 60);
        }

        function createConfetti() {
            const el = document.createElement('div');
            el.classList.add('confetti');

            const items = ['❤️', '💖', '💕', '💗', '✨', '⭐', '🌸', '💘', '💫', '🥳'];
            el.innerHTML = items[Math.floor(Math.random() * items.length)];

            const size = Math.floor(Math.random() * 35) + 14;
            el.style.fontSize = size + 'px';

            el.style.left = Math.random() * 92 + 'vw';
            el.style.animationDuration = (Math.random() * 2 + 1.8) + 's';

            document.body.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 3500);
        }

        function kacir() {
            const btn = document.getElementById('hayirBtn');
            const x = Math.random() * 140 - 70;
            const y = Math.random() * 70 - 35;
            btn.style.transform = `translate(${x}px, ${y}px)`;
        }
    </script>

</body>
</html>
